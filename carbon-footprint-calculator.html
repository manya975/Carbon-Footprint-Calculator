<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carbon Footprint Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  
  * { 
    box-sizing: border-box; 
    margin:0; 
    padding:0; 
    font-family: "Poppins", sans-serif; }
  
  body { 
    background: linear-gradient(135deg, #0a1628 0%, #1a2f45 50%, #2a4560 100%);
    display:flex; flex-direction:column; align-items:center; min-height:100vh; 
    overflow-x:hidden; position:relative; padding:20px 0;
  }
  body::before {
    content:''; 
    position:absolute; 
    top:0; 
    left:0;
    right:0; 
    bottom:0;
    background: 
      radial-gradient(circle at 20% 50%, rgba(82,183,136,0.2) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(27,67,50,0.25) 0%, transparent 50%),
      radial-gradient(circle at 50% 20%, rgba(52,211,153,0.15) 0%, transparent 60%);
    animation: gradientShift 15s ease infinite;
  }
  @keyframes gradientShift {
    0%, 100% { opacity:0.6; transform:scale(1) rotate(0deg); }
    50% { opacity:1; transform:scale(1.1) rotate(5deg); }
  }
  .particle {
    position: fixed; border-radius:50%; pointer-events:none;
    background: radial-gradient(circle, rgba(82,183,136,0.9) 0%, rgba(82,183,136,0) 70%);
    animation: floatParticle linear infinite;
    box-shadow: 0 0 15px rgba(82,183,136,0.5);
  }
  @keyframes floatParticle {
    0% { transform: translateY(100vh) translateX(0) scale(0) rotate(0deg); opacity:0; }
    10% { opacity:0.8; }
    90% { opacity:0.5; }
    100% { transform: translateY(-100px) translateX(var(--drift)) scale(1) rotate(360deg); opacity:0; }
  }
  .header-container {
    text-align:center; z-index:10; position:relative;
    animation:fadeSlideDown 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  
  h1 { 
    font-size:3.5rem; font-weight:700; margin:2rem 0 1rem 0;
    background: linear-gradient(135deg, #34d399 0%, #52B788 30%, #95D5B2 60%, #D8F3DC 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; 
    filter: drop-shadow(0 0 30px rgba(82,183,136,0.5));
    animation: shimmer 4s ease-in-out infinite;
    position:relative;
  }
  
  h1::after {
    position:absolute;
    top:-10px;
    right:-50px;
    font-size:2rem;
    animation: leafFloat 3s ease-in-out infinite;
  }
  
  @keyframes leafFloat {
    0%, 100% { transform:translateY(0) rotate(0deg); }
    50% { transform:translateY(-10px) rotate(15deg); }
  }
  
  @keyframes shimmer {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(82,183,136,0.5)) brightness(1); }
    50% { filter: drop-shadow(0 0 50px rgba(82,183,136,0.8)) brightness(1.3); }
  }

  .subtitle { 
    color:#B7E4C7; font-size:1.15rem; max-width:650px; margin:0 auto 2.5rem auto;
    font-weight:400; animation:fadeSlideDown 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    text-shadow: 0 2px 15px rgba(0,0,0,0.4);
    line-height:1.6;
  }
  .container {
    background: rgba(255,255,255,0.08); 
    backdrop-filter: blur(25px); 
    border-radius:32px; padding:3rem; width:90%; max-width:550px;
    box-shadow: 
      0 8px 32px rgba(0,0,0,0.4), 
      inset 0 1px 0 rgba(255,255,255,0.15),
      0 0 0 1px rgba(82,183,136,0.1),
      0 20px 60px rgba(82,183,136,0.15);
    position:relative; z-index:10;
    animation:fadeSlideUp 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .container::before {
    content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px;
    border-radius:32px; 
    opacity:0; transition:opacity 0.4s ease;
    z-index:-1;
    filter:blur(8px);
  }
  
  .container:hover { 
    transform:translateY(-8px) scale(1.01); 
    box-shadow: 
      0 15px 50px rgba(0,0,0,0.5), 
      inset 0 1px 0 rgba(255,255,255,0.25),
      0 0 0 1px rgba(82,183,136,0.3),
      0 25px 80px rgba(82,183,136,0.25);
  }
  .container:hover::before { opacity:1; }

  .input-group {
    margin-bottom:1.8rem; position:relative;
    animation:fadeSlideRight 0.6s ease forwards;
    opacity:0;
  }
  .input-group:nth-child(1) { animation-delay:0.1s; }
  .input-group:nth-child(2) { animation-delay:0.2s; }
  .input-group:nth-child(3) { animation-delay:0.3s; }
  .input-group:nth-child(4) { animation-delay:0.4s; }

  label { 
    display:flex; align-items:center; gap:0.6rem;
    margin-bottom:0.7rem; font-weight:600; color:#D8F3DC;
    font-size:0.98rem; letter-spacing:0.3px; 
    transition:all 0.3s ease;
  }
  
  .icon {
    font-size:1.3rem;
    filter:drop-shadow(0 2px 6px rgba(82,183,136,0.4));
    animation:iconBounce 2s ease infinite;
  }
  
  @keyframes iconBounce {
    0%, 100% { transform:translateY(0) scale(1); }
    50% { transform:translateY(-3px) scale(1.05); }
  }
  
  .input-wrapper {
    position:relative; overflow:hidden; border-radius:16px;
  }
  
  .input-wrapper::before {
    content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(82,183,136,0.5), transparent);
    transition:left 0.6s ease;
    z-index:1;
  }
  
  .input-wrapper:focus-within::before { left:100%; }

  input {
    width:100%; padding:1.1rem 1.3rem; 
    background:rgba(255,255,255,0.06); 
    border:2px solid rgba(82,183,136,0.2);
    border-radius:16px; font-size:1rem; color:#fff;
    transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position:relative;
    font-weight:500;
  }
  
  input::placeholder { color:rgba(255,255,255,0.5); }
  
  input:focus {
    outline:none; 
    background:rgba(255,255,255,0.12);
    border-color:#52B788; 
    transform:translateY(-3px);
    box-shadow:
      0 10px 30px rgba(82,183,136,0.4), 
      0 0 0 4px rgba(82,183,136,0.15),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  
  input:hover:not(:focus) {
    border-color:rgba(82,183,136,0.4); 
    background:rgba(255,255,255,0.09);
    box-shadow:0 4px 15px rgba(82,183,136,0.2);
  }

  .btn-calculate {
    width:100%; 
    background:linear-gradient(135deg, #34d399 0%, #52B788 50%, #35986c 100%);
    color:white; padding:1.3rem; border:none; border-radius:16px;
    font-size:1.12rem; cursor:pointer; font-weight:700; letter-spacing:1px;
    margin-top:1.2rem; position:relative; overflow:hidden;
    box-shadow:
      0 10px 35px rgba(82,183,136,0.4),
      inset 0 1px 0 rgba(255,255,255,0.2);
    transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation:fadeSlideRight 0.6s ease forwards 0.5s;
    opacity:0;
    text-transform:uppercase;
  }
  
  .btn-calculate::before {
    content:''; position:absolute; top:50%; left:50%;
    width:0; height:0; border-radius:50%;
    background:rgba(255,255,255,0.3);
    transform:translate(-50%,-50%);
    transition:width 0.6s ease, height 0.6s ease;
  }
  
  .btn-calculate::after {
    content:''; position:absolute; top:0; left:0; right:0; bottom:0;
    background:linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
    transform:translateX(-100%);
    transition:transform 0.6s ease;
  }
  
  .btn-calculate:hover::before { width:450px; height:450px; }
  .btn-calculate:hover::after { transform:translateX(100%); }
  
  .btn-calculate:hover {
    transform:translateY(-4px) scale(1.02);
    box-shadow:
      0 15px 50px rgba(82,183,136,0.6),
      inset 0 1px 0 rgba(255,255,255,0.3);
  }
  
  .btn-calculate:active { transform:translateY(-2px) scale(0.99); }
  
  .btn-calculate span { position:relative; z-index:1; }

  .result {
    margin-top:2.5rem; 
    background: linear-gradient(135deg, rgba(82,183,136,0.18) 0%, rgba(45,106,79,0.18) 100%);
    backdrop-filter:blur(15px); padding:2.5rem; border-radius:24px; 
    border:2px solid rgba(82,183,136,0.35);
    box-shadow:
      0 10px 35px rgba(0,0,0,0.3), 
      inset 0 1px 0 rgba(255,255,255,0.15),
      0 0 40px rgba(82,183,136,0.2);
    opacity:0; transform:scale(0.92) translateY(30px);
    transition:all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .result.show { opacity:1; transform:scale(1) translateY(0); }
  
  .result h2 { 
    color:#D8F3DC; margin-bottom:1.8rem; font-size:1.7rem; text-align:center;
    font-weight:700; letter-spacing:0.5px;
    animation:pulse 2.5s ease infinite;
    text-shadow:0 2px 15px rgba(82,183,136,0.4);
  }
  
  @keyframes pulse {
    0%, 100% { transform:scale(1); }
    50% { transform:scale(1.03); }
  }
  
  #total {
    text-align:center; font-size:3rem; font-weight:800; margin-bottom:2.2rem;
    background: linear-gradient(135deg, #34d399 0%, #52B788 50%, #95D5B2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; 
    animation:countGlow 1.5s ease;
    filter:drop-shadow(0 0 15px rgba(82,183,136,0.4));
  }
  
  @keyframes countGlow {
    0% { filter:drop-shadow(0 0 10px rgba(82,183,136,0.3)); }
    50% { filter:drop-shadow(0 0 30px rgba(82,183,136,0.7)); }
    100% { filter:drop-shadow(0 0 15px rgba(82,183,136,0.4)); }
  }

  .breakdown-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:1rem 1.4rem; margin-bottom:1rem; border-radius:14px;
    background:rgba(255,255,255,0.08); 
    backdrop-filter:blur(8px);
    border-left:5px solid #52B788;
    opacity:0; animation:slideInLeft 0.5s ease forwards;
    transition:all 0.3s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
  }
  
  .breakdown-item:hover {
    background:rgba(82,183,136,0.2); 
    transform:translateX(8px) scale(1.02);
    box-shadow:0 6px 20px rgba(82,183,136,0.3);
    border-left-color:#34d399;
  }
  
  .breakdown-item:nth-child(1) { animation-delay:0.1s; border-left-color:#34d399; }
  .breakdown-item:nth-child(2) { animation-delay:0.2s; border-left-color:#52B788; }
  .breakdown-item:nth-child(3) { animation-delay:0.3s; border-left-color:#95D5B2; }
  .breakdown-item:nth-child(4) { animation-delay:0.4s; border-left-color:#B7E4C7; }
  
  .breakdown-label { 
    color:#B7E4C7; font-weight:600; font-size:1rem;
    display:flex; align-items:center; gap:0.6rem;
    text-shadow:0 2px 8px rgba(0,0,0,0.3);
  }
  
  .breakdown-label .emoji {
    font-size:1.4rem;
    filter:drop-shadow(0 2px 6px rgba(82,183,136,0.4));
  }
  
  .breakdown-value { 
    color:#D8F3DC; font-weight:700; font-size:1.25rem;
    text-shadow:0 2px 12px rgba(82,183,136,0.4);
  }

  @keyframes fadeSlideDown {
    from { opacity:0; transform:translateY(-40px); }
    to { opacity:1; transform:translateY(0); }
  }
  
  @keyframes fadeSlideUp {
    from { opacity:0; transform:translateY(60px); }
    to { opacity:1; transform:translateY(0); }
  }
  
  @keyframes fadeSlideRight {
    from { opacity:0; transform:translateX(-40px); }
    to { opacity:1; transform:translateX(0); }
  }
  
  @keyframes slideInLeft {
    from { opacity:0; transform:translateX(-30px); }
    to { opacity:1; transform:translateX(0); }
  }

  @media(max-width:600px){
    h1{font-size:2.5rem;}
    h1::after{right:-35px; font-size:1.5rem;}
    .container{padding:2rem 1.5rem;}
    #total{font-size:2.3rem;}
  }
</style>
</head>
<body>

<div class="header-container">
  <h1>Carbon Footprint Calculator</h1>
  <p class="subtitle">Estimate your annual CO₂ emissions and discover your environmental impact</p>
</div>

<div class="container">
  <div class="input-group">
    <label>
      <span class="icon">⚡</span>
      Electricity per month (kWh)
    </label>
    <div class="input-wrapper">
      <input id="electricity" type="number" placeholder="e.g. 300">
    </div>
  </div>

  <div class="input-group">
    <label>
      <span class="icon">🚗</span>
      Petrol per week (liters)
    </label>
    <div class="input-wrapper">
      <input id="petrol" type="number" placeholder="e.g. 20">
    </div>
  </div>

  <div class="input-group">
    <label>
      <span class="icon">✈️</span>
      Short flights per year (km)
    </label>
    <div class="input-wrapper">
      <input id="shortFlight" type="number" placeholder="e.g. 500">
    </div>
  </div>

  <div class="input-group">
    <label>
      <span class="icon">🛫</span>
      Long flights per year (km)
    </label>
    <div class="input-wrapper">
      <input id="longFlight" type="number" placeholder="e.g. 2000">
    </div>
  </div>

  <button class="btn-calculate" onclick="calculate()">
    <span>Calculate My Footprint</span>
  </button>

  <div class="result" id="result">
    <h2> Your Carbon Footprint</h2>
    <div id="total"></div>
    <div id="breakdown"></div>
  </div>
</div>

<script>
  function createParticles() {
    for(let i=0; i<45; i++){
      let p = document.createElement('div');
      p.className='particle';
      const size = Math.random()*8+4;
      p.style.width = size+'px';
      p.style.height = size+'px';
      p.style.left = Math.random()*100+'%';
      p.style.setProperty('--drift', (Math.random()*250-125)+'px');
      p.style.animationDuration = (15+Math.random()*20)+'s';
      p.style.animationDelay = Math.random()*5+'s';
      document.body.appendChild(p);
    }
  }
  createParticles();

  function calculate(){
    const e=parseFloat(document.getElementById("electricity").value)||0;
    const p=parseFloat(document.getElementById("petrol").value)||0;
    const s=parseFloat(document.getElementById("shortFlight").value)||0;
    const l=parseFloat(document.getElementById("longFlight").value)||0;

    const efE=0.5, efP=2.31, efS=0.15, efL=0.11;
    const yE=e*12*efE, yP=p*52*efP, yS=s*efS, yL=l*efL;
    const total=(yE+yP+yS+yL)/1000;

    const totalEl=document.getElementById("total");
    const breakdownEl=document.getElementById("breakdown");
    const resultDiv=document.getElementById("result");
    
    resultDiv.classList.add("show");

    let current=0;
    const duration=1600;
    const increment=total/(duration/16);
    const animateNum=()=>{
      current+=increment; 
      if(current>=total) current=total; 
      totalEl.innerHTML=`<strong>${current.toFixed(2)}</strong>t CO2`;
      if(current<total) requestAnimationFrame(animateNum);
    }
    animateNum();

    breakdownEl.innerHTML='';
    const breakdowns=[
      {label:'Electricity', value:(yE/1000).toFixed(2), icon:'⚡'},
      {label:'Petrol', value:(yP/1000).toFixed(2), icon:'🚗'},
      {label:'Short Flights', value:(yS/1000).toFixed(2), icon:'✈️'},
      {label:'Long Flights', value:(yL/1000).toFixed(2), icon:'🛫'}
    ];
    
    breakdowns.forEach((item,i)=>{
      let div=document.createElement('div');
      div.className='breakdown-item';
      div.innerHTML=`
        <span class="breakdown-label">
          <span class="emoji">${item.icon}</span>
          ${item.label}
        </span>
        <span class="breakdown-value">${item.value} t</span>
      `;
      breakdownEl.appendChild(div);
    });
  }
</script>
</body>
</html>
